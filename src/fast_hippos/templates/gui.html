<!doctype html>
<html lang="en" data-theme="__FH_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST-HIPPOS</title>
<link rel="icon" type="image/png" href="__FH_ICON__">
<style>
:root {
  --bg: #f4f4f8; --panel: #ffffff; --panel2: #f1f0f6; --line: #e2e1ea; --text: #1d1b2e; --muted: #67657d;
  --accent: #5b3fe0; --accent-strong: #5b3fe0; --accent-soft: rgba(91,63,224,.10); --hit: #d0157f; --ok: #1f7a3a; --warn: #a15c00;
  --err: #b42318; --changed: #e69500; color-scheme: light;
  /* saturation and lightness of the card colours (see .card); the hue is per card */
  --t-band: 70% 96%; --t-title: 50% 28%; --t-stripe: 55% 52%; --t-adv: 40% 98.6%; --t-toggle: 40% 40%; --t-h3: 45% 36%;
  --t-h3line: 45% 86%;
}
/* dark: by the system setting, unless light was chosen with the ◐ button; or chosen with it */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0e17; --panel: #181724; --panel2: #201f2e; --line: #2b2940; --text: #e8e6f3; --muted: #a09db8;
  --accent: #8c76ff; --accent-strong: #6a50ee; --accent-soft: rgba(140,118,255,.14); --hit: #ff4fb0; --ok: #4cc27a;
  --warn: #f0b04a; --err: #ff7b6e; --changed: #ffb340; color-scheme: dark;
  --t-band: 18% 16%; --t-title: 55% 82%; --t-stripe: 45% 58%; --t-adv: 12% 12%; --t-toggle: 40% 72%; --t-h3: 45% 74%;
  --t-h3line: 18% 25%;
} }
:root[data-theme="dark"] {
  --bg: #0f0e17; --panel: #181724; --panel2: #201f2e; --line: #2b2940; --text: #e8e6f3; --muted: #a09db8;
  --accent: #8c76ff; --accent-strong: #6a50ee; --accent-soft: rgba(140,118,255,.14); --hit: #ff4fb0; --ok: #4cc27a;
  --warn: #f0b04a; --err: #ff7b6e; --changed: #ffb340; color-scheme: dark;
  --t-band: 18% 16%; --t-title: 55% 82%; --t-stripe: 45% 58%; --t-adv: 12% 12%; --t-toggle: 40% 72%; --t-h3: 45% 74%;
  --t-h3line: 18% 25%;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 6px 16px; position: sticky; top: 0; z-index: 15;
  background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 10px; }
header .logo { width: 44px; height: 44px; border-radius: 9px; background: #fff; box-shadow: 0 0 0 1px var(--line); flex: none; }
header h1 { margin: 0; font-size: 18px; } header .sub { color: var(--muted); }
header .sp { flex: 1; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 600; padding: 7px 14px; }
button.small { padding: 1px 7px; font-size: 12px; }
button.link { background: none; border: none; color: var(--accent); padding: 0; }
main { display: grid; grid-template-columns: minmax(0, 940px) 700px; justify-content: center; gap: 14px; padding: 0 16px 24px;
  align-items: start; }
@media (max-width: 1330px) { main { grid-template-columns: minmax(0, 940px); } }
/* folding a section: click its title bar */
.card > h2.toggle { cursor: pointer; user-select: none; }
.card > h2.toggle .fold { display: inline-block; width: 12px; color: hsl(var(--h) var(--t-stripe)); transition: transform .15s; }
.card.folded > h2.toggle .fold { transform: rotate(-90deg); }
.card.folded > h2 { border-bottom: none; }
.card.folded > :not(h2) { display: none; }
.tabs { display: flex; gap: 4px; height: 28px; align-items: center; margin-bottom: 10px; }
/* side by side: the Run panel starts level with the first settings section (below the row above it) */
@media (min-width: 1331px) { .side { margin-top: 38px; } }
.tabs button { border-radius: 999px; padding: 5px 14px; }
.tabs button.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.tabs .note { align-self: center; margin-left: 8px; color: var(--changed); }
.tabs .sp { flex: 1; }
.switch { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.adv { border-top: 1px dashed var(--line); }
.adv > .advtoggle { width: 100%; text-align: left; background: none; border: none; border-radius: 0; padding: 7px 12px; color: var(--muted); }
.adv > .advtoggle:hover { color: var(--accent); }
.adv .count { color: var(--changed); }
.adv h3 { margin: 6px 12px 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.adv .body { padding-top: 8px; }
.card .note { padding: 10px 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; --h: 212; }
.card > h2 { margin: 0; font-size: 13.5px; padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
/* Hierarchy by colour, one subtle hue per card (--h, set per card): tinted title band with a stripe, sub-headings
   and the advanced toggle in the card's hue, a faint tint behind the advanced settings. */
.card > h2 { background: hsl(var(--h) var(--t-band)); color: hsl(var(--h) var(--t-title)); box-shadow: inset 4px 0 hsl(var(--h) var(--t-stripe)); }
.card .adv { background: hsl(var(--h) var(--t-adv)); }
.card .adv > .advtoggle { color: hsl(var(--h) var(--t-toggle)); }
.card .adv h3 { color: hsl(var(--h) var(--t-h3)); border-bottom-color: hsl(var(--h) var(--t-h3line)); }
.card > h2 .count { color: var(--changed); font-weight: 500; font-size: 12px; }
.card > h2 .sp { flex: 1; }
.body { padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 18px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label { color: var(--text); font-size: 12px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
.field.off { opacity: .42; }
.field.off.unused { opacity: .28; }  /* never used by this version */
.body.col { grid-template-columns: 1fr; gap: 6px; }
.adv .body + .body { padding-top: 0; }  /* the rows of one group */
.field.off input, .field.off select, .field.off button { cursor: not-allowed; }
#stopped { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 20; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
#stopped.on { display: flex; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
#stopped:not(.busy) .spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.field.changed > label::after { content: "●"; color: var(--changed); font-size: 9px; }
.field .help { color: var(--muted); font-size: 11.5px; }
.field.check { flex-direction: row; align-items: center; gap: 7px; } .field.check > label { color: var(--text); font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; } .row > input:not([type=checkbox]), .row > select { flex: 1; min-width: 0; }
.files { display: flex; flex-direction: column; gap: 4px; }
.file { display: flex; gap: 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.file .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.file .bad { color: var(--err); }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: var(--muted); }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); }
.crit { display: grid; grid-template-columns: 56px minmax(150px, 1.4fr) 76px minmax(60px, .6fr) minmax(60px, .6fr) 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.pill { border-radius: 999px; font-size: 11.5px; font-weight: 700; padding: 2px 0; }
.pill.AND { background: var(--accent-soft); color: var(--accent); } .pill.OR { background: rgba(208,21,127,.12); color: var(--hit); }
.side { position: sticky; top: 12px; }
.checks { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 4px; }
.checks li { display: flex; gap: 7px; } .checks .i { width: 16px; text-align: center; }
.checks .err { color: var(--err); } .checks .warn { color: var(--warn); } .checks .ok { color: var(--ok); }
.checks .info { color: var(--muted); }
.imgsets { padding: 8px 12px 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.imgsets-h { color: hsl(var(--h) var(--t-h3)); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.imgset { display: flex; gap: 8px; align-items: center; } .imgset .muted { flex: 1; } .checks .busy { color: var(--accent); }
.checks .busy .i::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line);
  border-top-color: var(--accent); animation: spin .9s linear infinite; vertical-align: -1px; }
.runbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.state { font-weight: 600; } .state.running { color: var(--accent); } .state.done { color: var(--ok); } .state.failed, .state.stopped { color: var(--err); }
.progress { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
pre.log { margin: 0; height: 330px; overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  font: 11.5px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
pre.log .w { color: var(--warn); } pre.log .e { color: var(--err); }
.results { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.muted { color: var(--muted); }
/* the top bar: Setup | Overview | Image; the overview and the dashboards are shown inside the window */
.views { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.views button.v { border-radius: 999px; padding: 5px 14px; }
.views button.v.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.views select { max-width: 240px; padding: 4px 6px; }
#viewPages { display: none; } body.pages #viewPages { display: block; } body.pages main, body.pages .setupOnly { display: none; }
body.pages header { margin-bottom: 0; }
#viewPages iframe { border: 0; width: 100%; height: calc(100vh - var(--hdr, 60px)); display: none; background: var(--bg); }
#viewPages iframe.on { display: block; }
.menu { position: relative; } .menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > div { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.menu summary.btnlike { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
.setupOnly { display: contents; }
/* the bar of the experiment, above everything else on the Setup page */
#expBar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 1654px; margin: 0 auto 12px; padding: 8px 12px; width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; }
#expBar b { font-size: 13.5px; } #expBar select { flex: 0 1 460px; min-width: 180px; font-weight: 600; } #expBar .sp { flex: 1; }
body.pages #expBar, body:not(.pages) #selImage { display: none; }
/* the images of the experiment: one table */
.itable { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; overflow-x: auto; }
.irow { display: grid; grid-template-columns: 18px minmax(170px, 1.4fr) minmax(120px, 1fr) 132px 58px 58px 24px; gap: 6px; align-items: center; min-width: 640px; padding: 3px 5px; border-radius: 6px; border: 1px solid transparent; }
.irow.head { color: var(--muted); font-size: 11.5px; padding-bottom: 0; }
.irow.done { cursor: pointer; } .irow.done:hover { background: var(--panel2); } .irow.current { background: var(--accent-soft); border-color: var(--accent); }
.irow.skip:not(.done) { opacity: .6; }
.irow .nm { display: flex; flex-direction: column; min-width: 0; gap: 1px; } .irow .nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .src { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .irow .src .bad { color: var(--err); }
.irow input[type=text] { min-width: 0; width: 100%; } .irow .st { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .st.again, .irow .st.differs { color: var(--warn); } .irow .st.ok { color: var(--ok); } .irow .hits { color: var(--hit); font-size: 12px; text-align: right; }
.ro { display: flex; flex-direction: column; gap: 3px; overflow-x: auto; }
.rorow { display: grid; grid-template-columns: 18px minmax(110px, 170px) minmax(220px, 1fr) 84px 84px; gap: 6px; align-items: center; min-width: 560px; }
.rorow.head { color: var(--muted); font-size: 11.5px; } .rorow .src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rorow input[type=text], .rorow input[type=number] { min-width: 0; width: 100%; }
.itools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .itools .sp { flex: 1; }
.results .grp { color: var(--muted); margin-top: 6px; }
/*__HELP_CSS__*/
/*__DIALOG_CSS__*/
/* Cellpose on this computer (Cell segmentation card) */
.cps { border-top: 1px dashed var(--line); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.cps-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: hsl(var(--h) var(--t-h3)); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.cps-h .sp { flex: 1; } .cps-h button { text-transform: none; letter-spacing: 0; font-weight: 400; }
.cps-row { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--panel); display: flex; flex-direction: column; gap: 5px; }
.cps-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; } .cps-top b { font-weight: 600; } .cps-top .sp { flex: 1; }
.cps-path { font: 11.5px Consolas, ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
.cps-found { border-left: 3px solid var(--warn); padding-left: 8px; display: flex; flex-direction: column; gap: 4px; }
.cps-btns { display: flex; gap: 6px; flex-wrap: wrap; } .cps-btns button.use { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.cps-log { font: 11px Consolas, ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; max-height: 90px; overflow: auto; margin: 0; }
/* updates: a bar when a newer version is there, and a dialog (version line, "Updates…") */
#updateBar { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 16px 10px; padding: 7px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }
#updateBar.on { display: flex; } #updateBar .sp { flex: 1; }
#updDlg { width: min(620px, 92vw); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 16px; }
#updDlg::backdrop { background: rgba(0,0,0,.4); } #updDlg h2 { margin: 0 0 8px; font-size: 16px; }
#updNotes { white-space: pre-wrap; max-height: 40vh; overflow: auto; background: var(--panel2); border-radius: 6px; padding: 8px 10px; font: 12px/1.45 system-ui, sans-serif; margin: 8px 0; }
#updDlg .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; } #updDlg .btns .sp { flex: 1; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; display: none; z-index: 10; }
</style>
</head>
<body data-help-home="guide/window">
<header data-help-scope="guide/window">
  <img class="logo" src="__FH_LOGO__" alt="FAST-HIPPOS">
  <div><h1>FAST-HIPPOS</h1><div class="sub"><span id="ver"></span> · <button class="link" id="bUpdates" title="See whether a newer version of FAST-HIPPOS is available, and install it">Check for updates</button> · <span id="from"></span></div></div>
  <nav class="views" id="views" data-help-scope="guide/window#finding-your-way">
    <button class="v on" data-view="setup" title="The settings, the checks and running the analysis">Setup</button>
    <button class="v" data-view="overview" title="The overview of the experiment: all analyzed images compared">Overview</button>
    <button class="v" data-view="image" title="The dashboard of the current image: cells, traces, kymograph and the screening">Image</button>
    <select id="selImage" title="Go to the dashboard of another analyzed image of the experiment"></select>
  </nav>
  <span class="sp"></span>
  <button id="popOut" hidden title="Open this page in a browser tab of its own (e.g. to see it next to another page)">↗</button>
  <span class="setupOnly">
  <details class="menu" data-help-scope="guide/window#settings-files"><summary class="btnlike" title="Open, save or reset the settings">Settings ▾</summary><div>
  <button id="bOpen" data-help-scope="guide/window#settings-files" title="Load settings from a .toml file (e.g. fast_hippos_settings.toml from an output folder)">Open settings…</button>
  <button id="bSave" data-help-scope="guide/window#settings-files" title="Save the settings as a .toml file">Save settings…</button>
  <button id="bReset" title="All settings back to the defaults">Defaults</button>
  </div></details>
  </span>
  <button id="helpBtn" title="The manual of this window. ? or F1 over a section: the part about that section">? Help</button>
  <button id="bTheme" title="Light / dark">◐</button>
  <button id="bQuit" title="Stop FAST-HIPPOS (a running analysis is stopped too)">Quit</button>
</header>
<div id="updateBar"><span id="updBarText"></span><span class="sp"></span><button class="small" id="updBarShow" title="See what is new and install it">What's new / update</button><button class="small" id="updBarLater" title="Do not mention it for a week">Later</button><button class="small" id="updBarSkip" title="Do not mention this version again; a newer one is offered as usual">Skip this version</button></div>
<dialog id="updDlg"><h2>Updates</h2><div id="updBody"></div><div class="btns"><label class="switch" title="Ask GitHub once a day whether there is a newer version. Nothing else is sent."><input type="checkbox" id="updAuto"> Check once a day</label><span class="sp"></span><button id="updCheck">Check now</button><button class="primary" id="updInstall" hidden>Install update</button><button id="updClose">Close</button></div></dialog>
<div id="stopped"><img class="logo" src="__FH_LOGO__" alt="" style="width:96px;height:96px;border-radius:14px;background:#fff">
  <h2 style="margin:0" id="stopTitle">FAST-HIPPOS has stopped</h2><div class="spinner"></div><div class="muted" id="stopText">You can close this tab. Start FAST-HIPPOS again to continue.</div></div>
<div id="expBar" data-help-scope="guide/window#the-experiment">
  <b>Experiment</b>
  <select id="expSel" title="The experiment you work in: its images, results and overview. Lists your recent experiments"></select>
  <button id="expNew" title="Start a new experiment: choose or make an empty folder for it">New…</button>
  <button id="expOpen" title="Open an existing experiment folder">Open…</button>
  <button id="expShow" title="Show the experiment folder in the file explorer">Show folder</button>
  <span class="sp"></span><span class="muted" id="expInfo"></span>
</div>
<main>
  <section>
    <div class="tabs"><label class="switch" title="Open the advanced settings of all sections at once"><input type="checkbox" id="advAll"> Show all advanced settings</label><span class="note" id="advNote"></span>
      <span class="sp"></span><button class="small" id="bFoldAll" title="Fold or unfold all settings sections at once (the Run panel stays as it is)">Fold all</button></div>
    <div id="form"></div>
  </section>
  <aside class="side">
    <div class="card" style="--h:150" data-card-title="Run"><h2 class="toggle" data-fold="Run" data-help="guide/window#the-run-card" title="Click to fold or unfold this section"><span class="fold">▾</span>Run</h2><div style="padding:10px 12px">
      <ul class="checks" id="checks"></ul>
      <div class="runbtns">
        <button class="primary" id="bRun" title="Analyze all images with these settings: segmentation, traces, screening and dashboards. The checks above must show no errors.">▶ Run analysis</button>
        <button id="bReapply" title="Redo event detection, screening and dashboards on the saved output in the output folder, without segmentation (seconds instead of minutes)">↻ Re-apply screening</button>
        <button id="bReapplyAll" hidden title="">↻ Re-apply all images</button>
        <button id="bStop" disabled title="Stop the running analysis. Results of images that were already finished are kept.">■ Stop</button>
      </div>
      <div><span class="state" id="state">Ready</span> <span class="muted" id="stateInfo"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <pre class="log" id="log"></pre>
      <div class="results" id="results"></div>
    </div></div>
  </aside>
</main>
<div id="viewPages"><iframe id="fr-overview" title="Overview of the experiment"></iframe></div>

<script>
"use strict";
const TOKEN = "__FH_TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function api(name, body = {}) {
  const r = await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-FH-Token": TOKEN }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
// Hover texts (title attributes) are drawn by the browser, which makes them very wide; break them into lines of
// about 60 characters when the mouse comes over them (works for titles set later too; already short lines stay).
function wrapTitle(t, n = 60) {
  return t.split("\n").map(line => {
    if (line.length <= n) return line;
    const out = []; let cur = "";
    for (const w of line.split(" ")) { if (cur && cur.length + 1 + w.length > n) { out.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }
    return out.concat(cur ? [cur] : []).join("\n");
  }).join("\n");
}
document.addEventListener("mouseover", (e) => {
  for (let el = e.target; el && el.nodeType === 1; el = el.parentNode) {
    if (el.title) { const w = wrapTitle(el.title); if (w !== el.title) el.title = w; return; }
  }
}, true);
function toast(msg, ms = 2500) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); }

let SCHEMA, S, DEFAULTS, ADV_ALL = false, INFO = {}, CP = {}, OUT = {}, JOB = { n: 0, state: "idle", run_id: 0 };
const FIELD = {};  // key -> spec
const get = (key) => { const [s, k] = key.split("."); return S[s][k]; };
const set = (key, v) => { const [s, k] = key.split("."); S[s][k] = v; };
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const isChanged = (f) => !same(get(f.key), f.default);
function holds(key, c) {
  const v = get(key), isSet = !(v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length));
  if (Array.isArray(c)) return c.some(x => same(v, x));
  if ("set" in c) return isSet === c.set;
  if ("not" in c) return !c.not.some(x => same(v, x));
  return true;
}
function shown(cond) { return !cond || Object.entries(cond).every(([k, c]) => holds(k, c)); }
// a setting that is not used with the current settings is greyed out; returns the reason, or "" if used
function unusedReason(f) {
  if (f.unused) return f.unused;  // never used by this version
  if ((f.key === "input.tau1" || f.key === "input.tau2") && fitActive()) return "read from the LAS X fit in the .lif, per readout (see FLIM readouts)";
  if (!f.enable) return "";
  const failed = Object.entries(f.enable).find(([k, c]) => !holds(k, c));
  return failed ? (SCHEMA.reasons[failed[0]] || "not used with the current settings") : "";
}

// ---------------------------------------------------------------- facts from the input files
function fileFacts() {
  const files = (S.input.files || []).map(p => INFO[p]).filter(Boolean);
  const num = (k) => files.map(f => f[k]).filter(v => v != null);
  return { files, channels: Math.max(0, ...num("channels")), frames: Math.min(Infinity, ...num("frames")),
           positions: files.length > 0 && files.every(f => f.stitched || f.positions), interval: files.length > 0 && files.every(f => f.frame_interval) };
}
async function inspect(paths) {
  const todo = paths.filter(p => !(p in INFO)); if (!todo.length) return;
  try { for (const f of (await api("inspect", { paths: todo })).files) INFO[f.path] = f; } catch (e) { toast(e.message); }
  render();
}
function fileMeta(f) {
  if (!f) return "…";
  if (!f.exists) return `<span class="bad">not found</span>`;
  if (f.error) return `<span class="bad">${esc(f.error)}</span>`;
  const parts = [];
  if (f.tiles) parts.push(`${f.tiles} tiles, stitched`);
  if (f.series) parts.push(`${f.series} series`);
  if (f.width) parts.push(`${f.width}×${f.height} px`);
  if (f.frames) parts.push(`${f.frames} frames`);
  if (f.channels) parts.push(`${f.channels} ch`);
  if (f.pixel_size) parts.push(`${f.pixel_size} µm/px`);
  if (f.frame_interval) parts.push(`${(+f.frame_interval).toFixed(2)} s/frame`);
  if (f.size_mb != null) parts.push(f.size_mb >= 1000 ? `${(f.size_mb / 1000).toFixed(1)} GB` : `${f.size_mb} MB`);
  return esc(parts.join(" · ")) + (f.stitched ? ` <span class="chip ok">stitched · stage positions</span>`
    : f.positions ? ` <span class="chip ok">stage position</span>` : "");
}

// ---------------------------------------------------------------- Cellpose status
const CP_MODELS = { cyto3: "cyto3 (Cellpose 3)", nuclei: "nuclei (Cellpose 3)", cyto2_cp3: "cyto2_cp3 (Cellpose 3)", cpsam: "cpsam (Cellpose 4, Cellpose-SAM)" };
function cpVersion() { return S.segmentation.cellpose_version || (S.segmentation.cellpose_model === "cpsam" ? 4 : 3); }
// the user's own environment first, then the copy installed with FAST-HIPPOS, else this environment ("")
function cpPython() { const v = cpVersion(); return S.segmentation[`cellpose${v}_python`] || (CPS && CPS.bundled[v]) || ""; }
async function checkCellpose() {
  const py = cpPython(), key = `${cpVersion()}|${py}`;
  if (CP[key]) return; CP[key] = { pending: true }; render();
  try { CP[key] = await api("cellpose", { python: py }); } catch (e) { CP[key] = { error: e.message }; }
  render();
  if (CP[key].cached) {  // shown at once from the last check; verify in the background (starting PyTorch takes seconds)
    try { CP[key] = await api("cellpose", { python: py, fresh: true }); } catch (e) { CP[key] = { error: e.message }; }
    render();
  }
}
function cpStatus() {
  if (S.segmentation.method !== "cellpose") return "";
  const v = cpVersion(), r = CP[`${v}|${cpPython()}`];
  if (!r) { setTimeout(checkCellpose); return `<span class="chip">checking Cellpose…</span>`; }
  if (r.pending) return `<span class="chip">checking Cellpose ${v}…</span>`;
  if (r.error || !r.cellpose) return `<span class="chip warn">Cellpose ${v} not found${cpPython() ? "" : ": choose or install it below"}</span>`;
  const major = +r.cellpose.split(".")[0];
  if (major !== v) return `<span class="chip warn">environment has Cellpose ${esc(r.cellpose)}, model needs ${v}</span>`;
  return `<span class="chip ok">Cellpose ${esc(r.cellpose)} · ${r.gpu ? "GPU " + esc(r.gpu) : "CPU only"}</span>`;
}

// ---------------------------------------------------------------- Cellpose on this computer: use, install or choose
// Found installations are only offered: nothing is used until the user says so.
let CPS = null;
const CP_CHANGING = new Set();  // versions whose choice is being changed (the row shows the options again)
const CP_LABEL = { 3: "cyto3, nuclei, cyto2_cp3", 4: "cpsam (Cellpose-SAM)" };
function cpProbe(v, py) {  // version and GPU of an environment, for its row; starting PyTorch takes seconds
  const key = `${v}|${py}`;
  if (!CP[key]) { CP[key] = { pending: true }; api("cellpose", { python: py }).catch(e => ({ error: e.message })).then(r => { CP[key] = r; paintCellpose(); }); }
  const r = CP[key];
  if (r.pending) return `<span class="chip">checking…</span>`;
  if (r.error || !r.cellpose) return `<span class="chip warn">does not start${r.error ? ": " + esc(String(r.error).slice(0, 90)) : ""}</span>`;
  if (+r.cellpose.split(".")[0] !== v) return `<span class="chip warn">has Cellpose ${esc(r.cellpose)}, not ${v}</span>`;
  return `<span class="chip ok">Cellpose ${esc(r.cellpose)} · ${r.gpu ? "GPU " + esc(r.gpu) : "CPU only"}</span>`;
}
function cpOptions(v, own) {
  const found = CPS.found.filter(f => f.major === v && f.python !== own), bundle = CPS.bundled[v];
  const offers = found.map(f => {
    const chip = cpProbe(v, f.python), r = CP[`${v}|${f.python}`];  // an environment that does not start is not offered
    const bad = r && !r.pending && (r.error || !r.cellpose || +r.cellpose.split(".")[0] !== v);
    return `<div class="cps-found"><span>Found an existing installation:</span><span class="cps-path">${esc(f.python)}</span><div>${chip}</div>`
      + (bad ? "" : `<div class="cps-btns"><button class="small use" data-cp="use" data-v="${v}" data-py="${esc(f.python)}" title="Run Cellpose ${v} from this environment. Nothing in it is changed.">Use this installation</button></div>`) + `</div>`;
  }).join("");
  const install = bundle ? `<button class="small" data-cp="bundled" data-v="${v}" title="Use the copy installed with FAST-HIPPOS">Use the copy installed with FAST-HIPPOS</button>`
    : CPS.can_install ? `<button class="small" data-cp="install" data-v="${v}" title="Download Cellpose ${v} with PyTorch into the FAST-HIPPOS folder. Removed when FAST-HIPPOS is uninstalled.">Install with FAST-HIPPOS (about ${CPS.size_gb} GB)</button>` : "";
  return offers + `<div class="cps-btns">${install}<button class="small" data-cp="own" data-v="${v}" title="Choose the python.exe of an environment that has Cellpose ${v}">Choose my own python.exe…</button>${CP_CHANGING.has(v) ? `<button class="small" data-cp="keep" data-v="${v}">Cancel</button>` : ""}</div>`
    + (!bundle && !CPS.can_install ? `<span class="muted">Installing from here needs FAST-HIPPOS installed with its setup; this copy runs from source.</span>` : "");
}
function cpRow(v) {
  const key = `cellpose${v}_python`, own = S.segmentation[key] || "", bundle = CPS.bundled[v], ins = CPS.install;
  const top = (chip, right = "") => `<div class="cps-top"><b>Cellpose ${v}</b><span class="muted">${CP_LABEL[v]}</span>${chip}<span class="sp"></span>${right}</div>`;
  const change = `<button class="small" data-cp="change" data-v="${v}" title="Use another installation">Change</button>`;
  if (ins.running && ins.version === v) return `<div class="cps-row">${top(`<span class="chip">installing…</span>`)}
    <div>${esc(ins.status || "")}</div><div class="progress" style="margin:0"><div style="width:${(ins.permille || 0) / 10}%"></div></div><pre class="cps-log">${esc((ins.lines || []).join("\n"))}</pre></div>`;
  const failed = ins.failed && ins.version === v ? `<div class="chip warn" style="border-radius:6px">The installation did not finish.</div><pre class="cps-log">${esc(ins.error || "")}</pre>` : "";
  if (!CP_CHANGING.has(v)) {
    if (own) return `<div class="cps-row">${top(`<span class="chip">your installation</span>`, change)}<span class="cps-path">${esc(own)}</span><div>${cpProbe(v, own)}</div></div>`;
    if (bundle) return `<div class="cps-row">${top(`<span class="chip">installed with FAST-HIPPOS</span>`, change)}<div>${cpProbe(v, bundle)}</div></div>`;
    if (CPS.here === v) return `<div class="cps-row">${top(`<span class="chip">in this Python environment</span>`, change)}<div>${cpProbe(v, "")}</div></div>`;
  }
  const n = CPS.found.filter(f => f.major === v).length;
  const chip = CP_CHANGING.has(v) ? `<span class="chip">choose</span>` : n ? `<span class="chip warn">found: your choice</span>` : `<span class="chip">not installed</span>`;
  return `<div class="cps-row">${top(chip)}${failed}${cpOptions(v, own)}</div>`;
}
function cellposeHTML() {
  if (!CPS) return `<div class="cps" id="cpSetup"><span class="muted">Looking for Cellpose…</span></div>`;
  const s = CPS.search;
  const searching = s.running ? `<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">${s.full ? `searching all drives: ${(s.folders || 0).toLocaleString("en")} folders` : "searching…"}</span><button class="small" data-cp="cancel">Stop</button>` : "";
  return `<div class="cps" id="cpSetup"><div class="cps-h"><span>Cellpose on this computer</span><span class="sp"></span>${searching}
    <button class="small" data-cp="search" ${s.running ? "disabled" : ""} title="Look again in the usual places (conda, mamba, uv and venv folders)">Search again</button>
    <button class="small" data-cp="full" ${s.running ? "disabled" : ""} title="Look through all local hard drives. Only names are read; this can take several minutes.">Search all drives</button></div>${cpRow(3)}${cpRow(4)}</div>`;
}
function paintCellpose() { const el = $("cpSetup"); if (el) { el.outerHTML = cellposeHTML(); } }
async function loadCellpose(first = false) {
  const was = CPS && CPS.install.running;
  try { CPS = await api(first ? "cellpose_search" : "cellpose_setup"); }
  catch { if (!CPS) setTimeout(() => loadCellpose(first), 2000); return; }
  if (was && !CPS.install.running && CPS.install.done) {  // installed: from now on this copy is used
    const v = CPS.install.version; S.segmentation[`cellpose${v}_python`] = null; CP_CHANGING.delete(v);
    for (const k in CP) if (k.startsWith(v + "|")) delete CP[k];
    api("remember", { settings: S }).catch(() => {}); toast(`Cellpose ${v} is installed`); render();
  } else if (first) render(); else paintCellpose();
  if (CPS.search.running || CPS.install.running) setTimeout(loadCellpose, 800);
}
async function cellposeAction(b) {
  const a = b.dataset.cp, v = +b.dataset.v, key = `cellpose${v}_python`;
  const chosen = (py) => { S.segmentation[key] = py; CP_CHANGING.delete(v); api("remember", { settings: S }).catch(() => {}); render(); };
  try {
    if (a === "use") chosen(b.dataset.py);
    else if (a === "bundled") chosen(null);
    else if (a === "change") { CP_CHANGING.add(v); paintCellpose(); }
    else if (a === "keep") { CP_CHANGING.delete(v); paintCellpose(); }
    else if (a === "own") {
      const r = (await api("browse", { kind: "file", title: `The python.exe of your Cellpose ${v} environment`, initial: S.segmentation[key] || "", types: "python" })).result;
      if (r) { delete CP[`${v}|${r}`]; chosen(r); }
    } else if (a === "install") {
      if (!await fhConfirm(`Install Cellpose ${v} with FAST-HIPPOS?\n\nThis downloads about ${CPS.size_gb} GB and can take 5 to 20 minutes. You can keep working meanwhile.`, { ok: "Install" })) return;
      CPS = await api("cellpose_install", { version: v }); paintCellpose(); setTimeout(loadCellpose, 800);
    } else if (a === "search" || a === "full") {
      CPS = await api("cellpose_search", { full: a === "full" }); paintCellpose(); setTimeout(loadCellpose, 400);
    } else if (a === "cancel") { CPS = await api("cellpose_search_cancel"); paintCellpose(); }
  } catch (e) { toast(e.message, 5000); }
}

// ---------------------------------------------------------------- updates
let UPD = null, UPDATING = false;
async function loadUpdates() {
  try { UPD = await api("update"); paintUpdates(); } catch { return; }
  if (UPD.checking) setTimeout(loadUpdates, 1500);
}
function paintUpdates() {
  if (!UPD) return;
  const n = UPD.latest;
  $("updateBar").classList.toggle("on", !!UPD.offer && !UPDATING);
  if (n) $("updBarText").textContent = `FAST-HIPPOS ${n.version} is available (you have ${UPD.current}).`;
  $("updAuto").checked = UPD.check;
  $("updCheck").disabled = UPD.checking;
  $("updCheck").textContent = UPD.checking ? "Checking…" : "Check now";
  $("updInstall").hidden = !(UPD.newer && UPD.can_install);
  const when = UPD.last_check ? new Date(UPD.last_check * 1000).toLocaleString() : "never";
  const ins = UPD.installing || {};
  $("updBody").innerHTML = `<div>You have version <b>${esc(UPD.current)}</b>. Last checked: ${esc(when)}.</div>`
    + (UPD.error ? `<div style="color:var(--warn)">${esc(UPD.error)}</div>` : "")
    + (ins.state === "failed" ? `<div style="color:var(--err)">The update could not start: ${esc(ins.error)}</div>` : "")
    + (ins.state === "downloading" ? `<div>Downloading version ${esc(ins.version)}… ${Math.round((ins.permille || 0) / 10)} %</div>` : "")
    + (UPD.newer ? `<div style="margin-top:6px">Version <b>${esc(n.version)}</b>${n.date ? ` (${esc(n.date)})` : ""} is available. <a href="${esc(n.page)}" target="_blank" rel="noopener">Release page</a></div><div id="updNotes">${esc(n.notes || "No release notes.")}</div>`
      + (UPD.can_install ? `<div class="muted">Your settings and results stay as they are. FAST-HIPPOS restarts in this tab.</div>` : `<div class="muted">This copy runs from source: update it with <code>git pull</code> and <code>uv sync</code>.</div>`)
      : `<div style="margin-top:6px;color:var(--ok)">${UPD.last_check ? "You have the newest version." : ""}</div>`);
}
async function updateChoice(action) { try { UPD = await api("update_choice", { action }); paintUpdates(); } catch (e) { toast(e.message); } }
$("bUpdates").onclick = () => { paintUpdates(); $("updDlg").showModal(); checkUpdatesNow(); };
$("updBarShow").onclick = () => { paintUpdates(); $("updDlg").showModal(); };
$("updBarLater").onclick = () => updateChoice("later");
$("updBarSkip").onclick = () => updateChoice("skip");
$("updClose").onclick = () => $("updDlg").close();
$("updAuto").onchange = () => updateChoice($("updAuto").checked ? "auto_on" : "auto_off");
$("updCheck").onclick = () => checkUpdatesNow();
async function checkUpdatesNow() {
  if (UPD) { UPD.checking = true; paintUpdates(); }
  try { UPD = await api("update_check"); } catch (e) { toast(e.message); if (UPD) UPD.checking = false; }
  paintUpdates();
}
$("updInstall").onclick = async () => {
  if (JOB.state === "running") { toast("An analysis is running. Update when it has finished.", 4000); return; }
  if (!await fhConfirm(`Install FAST-HIPPOS ${UPD.latest.version} now?\n\nFAST-HIPPOS closes, updates and restarts in this tab. Your settings and results stay as they are.`, { ok: "Install and restart" })) return;
  try { await api("remember", { settings: S }); UPD = await api("update_start"); } catch (e) { toast(e.message, 5000); return; }
  UPDATING = true; $("updDlg").close();
  $("stopTitle").textContent = "Updating FAST-HIPPOS…"; $("stopText").textContent = "Your settings and results stay as they are.";
  $("stopped").classList.add("busy", "on");
  // Until this port shows the installer's page or the new version (a page with another token). A request can hang
  // while the program stops, so each one has a time limit.
  const limit = (p) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error("timeout")), 3000))]);
  for (let i = 0; i < 900; i++) {
    await new Promise(r => setTimeout(r, 400));
    try {
      const t = await limit(fetch("/", { cache: "no-store" }).then(r => r.text()));
      // (the installer's page recognises the new version by the absence of its own title word in brackets: keep that
      // exact text out of this page)
      if (/<title>[^<]*updating/.test(t) || !t.includes(TOKEN)) { location.reload(); return; }
      UPD = await limit(api("update"));  // still this program: did the download fail?
      if (UPD.installing.state === "failed") {
        UPDATING = false; $("stopped").classList.remove("busy", "on"); poll(); paintUpdates(); $("updDlg").showModal(); return;
      }
    } catch { /* between the two programs */ }
  }
  $("stopTitle").textContent = "The update takes longer than expected"; $("stopText").textContent = "Reload this tab, or start FAST-HIPPOS again.";
  $("stopped").classList.remove("busy");
};

// ---------------------------------------------------------------- widgets
function widget(f) {
  const v = get(f.key), id = "f_" + f.key.replace(".", "_");
  const num = (step) => `<input id="${id}" type="number" step="${step}" value="${v ?? ""}" placeholder="${esc(f.placeholder || (f.optional ? "—" : ""))}" data-num="${step === "1" ? "int" : "float"}">`;
  switch (f.kind) {
    case "bool": return `<input id="${id}" type="checkbox" ${v ? "checked" : ""}>`;
    case "int": return num("1");
    case "float": return num("any");
    case "boolselect": return `<select id="${id}">${Object.entries(f.choices).map(([k, l]) => `<option value="${k}" ${String(!!v) === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    case "select": return `<select id="${id}">${Object.entries(f.choices).map(([k, l]) => `<option value="${esc(k)}" ${same(k, v) || (f.num && +k === +v) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    case "frame": {
      const ff = fileFacts(), max = Number.isFinite(ff.frames) ? ff.frames - 1 : "";
      return `<div class="row"><input id="${id}" type="number" step="1" min="0" max="${max}" value="${v ?? ""}" placeholder="automatic" data-num="int"><span class="muted">${max !== "" ? "0–" + max : ""}</span></div>`;
    }
    case "channel": case "channel_required": {
      const n = Math.max(fileFacts().channels, v || 0, 1), opts = [];
      if (f.kind === "channel") opts.push(`<option value="" ${v == null ? "selected" : ""}>none</option>`);
      for (let c = 1; c <= n; c++) opts.push(`<option value="${c}" ${v === c ? "selected" : ""}>channel ${c}</option>`);
      return `<select id="${id}" data-num="int">${opts.join("")}</select>`;
    }
    case "file": case "python": case "folder":
      return `<div class="row"><input id="${id}" type="text" value="${esc(v ?? "")}" placeholder="${esc(f.placeholder || (f.optional ? "—" : ""))}"><button class="small" data-browse="${f.key}" data-kind="${f.kind}" title="Choose with a file dialog">Browse…</button></div>`;
    case "model": {
      const custom = !(v in CP_MODELS);
      return `<div class="row"><select id="${id}">${Object.entries(CP_MODELS).map(([k, l]) => `<option value="${k}" ${k === v ? "selected" : ""}>${l}</option>`).join("")}
        <option value="__custom" ${custom ? "selected" : ""}>custom model file…</option></select></div>
        ${custom ? `<div class="row"><input id="${id}_path" type="text" value="${esc(v)}"><button class="small" data-browse="${f.key}" data-kind="file" title="Choose a model file you trained yourself">Browse…</button></div>` : ""}
        <div>${cpStatus()}</div>`;
    }
    case "pair": {
      const [a, b] = v || ["", ""];
      return `<div class="row"><input id="${id}_0" type="number" step="any" value="${a ?? ""}" placeholder="off"> – <input id="${id}_1" type="number" step="any" value="${b ?? ""}" placeholder="off"></div>`;
    }
    case "intlist": return `<input id="${id}" type="text" value="${esc((v || []).join(", "))}" placeholder="all">`;
    case "metric": return `<select id="${id}"><option value="">(cell order)</option>${Object.keys(SCHEMA.metrics).map(m => `<option ${m === v ? "selected" : ""}>${m}</option>`).join("")}</select>`;
    case "files": return imagesHTML();
    case "readouts": return readoutsHTML();
    case "criteria": {
      const crit = v || [], metrics = [...Object.keys(SCHEMA.metrics), ...readoutMetrics()];
      const isGate = (c) => c.op === "inside" || c.op === "outside";
      return `<div>${crit.map((c, i) => isGate(c) ? `<div class="crit" data-crit="${i}">
          <button class="pill ${c.logic || S.screening.logic}" data-c="logic" title="AND: must pass · OR: at least one of the OR criteria must pass">${c.logic || S.screening.logic}</button>
          <span title="A region drawn in the scatter plot of a dashboard: cells whose two values lie inside (or outside) it pass">gate: ${esc(c.metric2)} vs ${esc(c.metric)}</span>

  for (const line of st.lines) {
    const cls = /ERROR|Traceback|Error:/.test(line) ? "e" : /WARNING/.test(line) ? "w" : "";
    log.insertAdjacentHTML("beforeend", `<span class="${cls}">${esc(line)}</span>\n`);
  }
  if (atEnd) log.scrollTop = log.scrollHeight;
  JOB.n = st.n; JOB.state = st.state;
  const all = log.textContent, nImg = (all.match(/INFO {4}--- /g) || []).length, total = Math.max(1, S.input.files.length);
  const label = { idle: "Ready", running: "Running…", done: "Done", failed: "Failed", stopped: "Stopped" }[st.state];
  $("state").textContent = label; $("state").className = "state " + st.state;
  const smp = [...all.matchAll(/=== (?:Sample|Image) (\d+) of (\d+)/g)].pop();  // several images, one after the other
  $("stateInfo").textContent = st.state !== "running" ? "" : smp ? `image ${smp[1]} of ${smp[2]}` : `image ${Math.min(nImg, total)} of ${total}`;
  $("bar").style.width = (st.state === "done" ? 100 : st.state === "running" ? Math.min(95, (Math.max(nImg, 1) - 0.5) / total * 100) : 0) + "%";
  $("bStop").disabled = st.state !== "running";
  if (changedState) { delete OUT[S.input.output || ""]; for (const k in EXPS) delete EXPS[k]; renderChecks(); renderResults(); }  // re-check for results
  if (changedState && st.state !== "running") {  // new results: the pages in the window are loaded again (the one shown at once)
    if (OPEN_AFTER && st.state === "done") VIEW.want = { view: "image", image: "." };
    OPEN_AFTER = false;
    for (const fr of allFrames()) if (fr.dataset.page) fr.dataset.stale = "1";
    if (VIEW.cur !== "setup") setTimeout(() => show(VIEW.cur, { fromHistory: true }), 800);
  }
  setTimeout(poll, st.state === "running" ? 700 : 2000);
}
$("results").addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { show(g.dataset.go, { image: g.dataset.image }); return; }
  const b = e.target.closest("[data-open]"); if (b) api("open", { path: b.dataset.open }).catch(err => toast(err.message));
});

// images with their own settings (Settings.image): set in an image's dashboard with 'Apply to this image only'
const OWN_LABELS = { stimulation_frame: "stimulation", calibration_frame: "calibration", baseline_only: "baseline only", no_calibration: "no calibration", sensitivity: "detection threshold",
  margin: "margin", response_window: "response window", response_window_anchor: "window anchor", response_window_margin: "window margin" };
const OWN_VALUES = { after_stimulation: "after S", before_calibration: "before C" };
function ownText(own) {
  const noCal = !!(own.events && own.events.no_calibration);
  const val = (k, v) => k === "response_window" && !(v > 0) ? "full" : v === null || v === "" ? (k === "calibration_frame" && noCal ? "none" : "automatic") : v === true ? "yes" : v === false ? "no" : OWN_VALUES[v] || v;
  return Object.values(own).flatMap(sec => Object.entries(sec).map(([k, v]) => `${OWN_LABELS[k] || k} ${val(k, v)}`)).join(", ");
}
// the own settings of single images of the run in a newly chosen output folder: taken over when this window has
// none (so that a re-apply keeps them); a warning when both have some and they differ
const sameJSON = (a, b) => JSON.stringify(a || {}) === JSON.stringify(b || {});
function differingImages(o) {  // the images whose own settings differ between the run and this window
  const a = (o.run && o.run.image_settings) || {}, b = S.image || {};
  return [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(n => JSON.stringify(a[n] || null) !== JSON.stringify(b[n] || null));
}
function imageSettingsDiffer(o) { return !!(o && o.run && !sameJSON(o.run.image_settings, S.image)); }
function adoptImageSettings(o) {
  const run = o && o.run && o.run.image_settings;
  if (run && Object.keys(run).length && !Object.keys(S.image || {}).length) {
    S.image = structuredClone(run); render();
    toast(`Own settings of single images taken over from the run in the output folder: ${Object.keys(run).join(", ")}`, 5000);
  }
}
function imageSettingsHTML() {
  const entries = Object.entries(S.image || {});
  const tip = "Images that use other stimulation settings or another response window than the settings above. Set them in the dashboard of "
    + "the image with 'Apply to this image only'; they are used by runs and re-applies until you remove them here.";
  if (!entries.length) return `<div class="imgsets muted" title="${esc(tip)}"><span>All images use these settings. To give one image its own stimulation frames or response window, use <i>Apply to this image only</i> in its dashboard.</span></div>`;
  return `<div class="imgsets" title="${esc(tip)}"><div class="imgsets-h">Own settings of single images <button class="hq" type="button" data-help-btn="guide/own-settings" title="Explain this (opens the manual)">?</button></div>` + entries.map(([name, own]) =>
    `<div class="imgset"><b>${esc(name)}</b><span class="muted">${esc(ownText(own))}</span><button class="small" data-rmimg="${esc(name)}" title="Remove the own settings of this image: it then uses the settings above (at the next run or re-apply)">✕</button></div>`).join("") + "</div>";
}
function setSettings(s) {
  S = s; S.image = S.image || {};
  for (const sec of SCHEMA.sections) for (const f of sec.fields) { const [a, k] = f.key.split("."); if (!(k in S[a])) S[a][k] = structuredClone(f.default); }
  inspect(S.input.files || []); render();
}
(async () => {
  SCHEMA = await api("schema");
  for (const sec of SCHEMA.sections) for (const f of sec.fields) FIELD[f.key] = f;
  DEFAULTS = (await api("defaults")).settings;
  const init = await api("initial");
  $("ver").textContent = "version " + SCHEMA.version;
  $("from").textContent = init.from ? "last used settings" : "default settings";
  setSettings(init.settings);
  if (S.input.experiment) await openExperiment(String(S.input.experiment), { startup: true });
  const h = location.hash.slice(1).split("/").map(decodeURIComponent);  // the view in the address (#overview, #image/<name>/<folder>)
  history.replaceState({ view: "setup" }, "", location.pathname);
  if (VIEWS.includes(h[0])) { if (h[0] === "image" && h[1] && S.input.experiment) await chooseImage(h[1]); VIEW.want = { view: h[0], image: h[2] || "" }; }
  const st = await api("status"); JOB = { n: 0, state: st.state, run_id: st.run_id };
  poll();
  loadCellpose(true);  // the quick search; what it finds is only offered
  loadUpdates(); setInterval(loadUpdates, 3600 * 1000);  // the check itself runs at most once a day
})();
</script>
