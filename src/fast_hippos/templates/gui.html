<!doctype html>
<html lang="en" data-theme="__FH_THEME__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST-HIPPOS</title>
<link rel="icon" type="image/png" href="__FH_ICON__">
<style>
:root {
  --bg: #f4f4f8; --panel: #ffffff; --panel2: #f1f0f6; --line: #e2e1ea; --text: #1d1b2e; --muted: #67657d;
  --accent: #5b3fe0; --accent-strong: #5b3fe0; --accent-soft: rgba(91,63,224,.10); --hit: #d0157f; --ok: #1f7a3a; --warn: #a15c00;
  --err: #b42318; --changed: #e69500; color-scheme: light;
  /* saturation and lightness of the card colours (see .card); the hue is per card */
  --t-band: 70% 96%; --t-title: 50% 28%; --t-stripe: 55% 52%; --t-adv: 40% 98.6%; --t-toggle: 40% 40%; --t-h3: 45% 36%;
  --t-h3line: 45% 86%;
}
/* dark: by the system setting, unless light was chosen with the ◐ button; or chosen with it */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0e17; --panel: #181724; --panel2: #201f2e; --line: #2b2940; --text: #e8e6f3; --muted: #a09db8;
  --accent: #8c76ff; --accent-strong: #6a50ee; --accent-soft: rgba(140,118,255,.14); --hit: #ff4fb0; --ok: #4cc27a;
  --warn: #f0b04a; --err: #ff7b6e; --changed: #ffb340; color-scheme: dark;
  --t-band: 18% 16%; --t-title: 55% 82%; --t-stripe: 45% 58%; --t-adv: 12% 12%; --t-toggle: 40% 72%; --t-h3: 45% 74%;
  --t-h3line: 18% 25%;
} }
:root[data-theme="dark"] {
  --bg: #0f0e17; --panel: #181724; --panel2: #201f2e; --line: #2b2940; --text: #e8e6f3; --muted: #a09db8;
  --accent: #8c76ff; --accent-strong: #6a50ee; --accent-soft: rgba(140,118,255,.14); --hit: #ff4fb0; --ok: #4cc27a;
  --warn: #f0b04a; --err: #ff7b6e; --changed: #ffb340; color-scheme: dark;
  --t-band: 18% 16%; --t-title: 55% 82%; --t-stripe: 45% 58%; --t-adv: 12% 12%; --t-toggle: 40% 72%; --t-h3: 45% 74%;
  --t-h3line: 18% 25%;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 6px 16px; position: sticky; top: 0; z-index: 15;
  background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 10px; }
header .logo { width: 44px; height: 44px; border-radius: 9px; background: #fff; box-shadow: 0 0 0 1px var(--line); flex: none; }
header h1 { margin: 0; font-size: 18px; } header .sub { color: var(--muted); }
header .sp { flex: 1; }
input, select, button, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
button { cursor: pointer; } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 600; padding: 7px 14px; }
button.small { padding: 1px 7px; font-size: 12px; }
button.link { background: none; border: none; color: var(--accent); padding: 0; }
main { display: grid; grid-template-columns: minmax(0, 940px) 700px; justify-content: center; gap: 14px; padding: 0 16px 24px;
  align-items: start; }
@media (max-width: 1330px) { main { grid-template-columns: minmax(0, 940px); } }
/* folding a section: click its title bar */
.card > h2.toggle { cursor: pointer; user-select: none; }
.card > h2.toggle .fold { display: inline-block; width: 12px; color: hsl(var(--h) var(--t-stripe)); transition: transform .15s; }
.card.folded > h2.toggle .fold { transform: rotate(-90deg); }
.card.folded > h2 { border-bottom: none; }
.card.folded > :not(h2) { display: none; }
.tabs { display: flex; gap: 4px; height: 28px; align-items: center; margin-bottom: 10px; }
/* side by side: the Run panel starts level with the first settings section (below the row above it) */
@media (min-width: 1331px) { .side { margin-top: 38px; } }
.tabs button { border-radius: 999px; padding: 5px 14px; }
.tabs button.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.tabs .note { align-self: center; margin-left: 8px; color: var(--changed); }
.tabs .sp { flex: 1; }
.switch { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.adv { border-top: 1px dashed var(--line); }
.adv > .advtoggle { width: 100%; text-align: left; background: none; border: none; border-radius: 0; padding: 7px 12px; color: var(--muted); }
.adv > .advtoggle:hover { color: var(--accent); }
.adv .count { color: var(--changed); }
.adv h3 { margin: 6px 12px 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.adv .body { padding-top: 8px; }
.card .note { padding: 10px 12px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; --h: 212; }
.card > h2 { margin: 0; font-size: 13.5px; padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
/* Hierarchy by colour, one subtle hue per card (--h, set per card): tinted title band with a stripe, sub-headings
   and the advanced toggle in the card's hue, a faint tint behind the advanced settings. */
.card > h2 { background: hsl(var(--h) var(--t-band)); color: hsl(var(--h) var(--t-title)); box-shadow: inset 4px 0 hsl(var(--h) var(--t-stripe)); }
.card .adv { background: hsl(var(--h) var(--t-adv)); }
.card .adv > .advtoggle { color: hsl(var(--h) var(--t-toggle)); }
.card .adv h3 { color: hsl(var(--h) var(--t-h3)); border-bottom-color: hsl(var(--h) var(--t-h3line)); }
.card > h2 .count { color: var(--changed); font-weight: 500; font-size: 12px; }
.card > h2 .sp { flex: 1; }
.body { padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 18px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label { color: var(--text); font-size: 12px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
.field.off { opacity: .42; }
.field.off.unused { opacity: .28; }  /* never used by this version */
.body.col { grid-template-columns: 1fr; gap: 6px; }
.adv .body + .body { padding-top: 0; }  /* the rows of one group */
.field.off input, .field.off select, .field.off button { cursor: not-allowed; }
#stopped { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 20; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
#stopped.on { display: flex; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
#stopped:not(.busy) .spinner { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.field.changed > label::after { content: "●"; color: var(--changed); font-size: 9px; }
.field .help { color: var(--muted); font-size: 11.5px; }
.field.check { flex-direction: row; align-items: center; gap: 7px; } .field.check > label { color: var(--text); font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; } .row > input:not([type=checkbox]), .row > select { flex: 1; min-width: 0; }
.files { display: flex; flex-direction: column; gap: 4px; }
.file { display: flex; gap: 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.file .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.file .bad { color: var(--err); }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11.5px; color: var(--muted); }
.chip.ok { color: var(--ok); border-color: var(--ok); } .chip.warn { color: var(--warn); border-color: var(--warn); }
.crit { display: grid; grid-template-columns: 56px minmax(150px, 1.4fr) 76px minmax(60px, .6fr) minmax(60px, .6fr) 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
.pill { border-radius: 999px; font-size: 11.5px; font-weight: 700; padding: 2px 0; }
.pill.AND { background: var(--accent-soft); color: var(--accent); } .pill.OR { background: rgba(208,21,127,.12); color: var(--hit); }
.side { position: sticky; top: 12px; }
.checks { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-direction: column; gap: 4px; }
.checks li { display: flex; gap: 7px; } .checks .i { width: 16px; text-align: center; }
.checks .err { color: var(--err); } .checks .warn { color: var(--warn); } .checks .ok { color: var(--ok); }
.checks .info { color: var(--muted); }
.imgsets { padding: 8px 12px 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.imgsets-h { color: hsl(var(--h) var(--t-h3)); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.imgset { display: flex; gap: 8px; align-items: center; } .imgset .muted { flex: 1; } .checks .busy { color: var(--accent); }
.checks .busy .i::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line);
  border-top-color: var(--accent); animation: spin .9s linear infinite; vertical-align: -1px; }
.runbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.state { font-weight: 600; } .state.running { color: var(--accent); } .state.done { color: var(--ok); } .state.failed, .state.stopped { color: var(--err); }
.progress { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
pre.log { margin: 0; height: 330px; overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  font: 11.5px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
pre.log .w { color: var(--warn); } pre.log .e { color: var(--err); }
.results { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.muted { color: var(--muted); }
/* the top bar: Setup | Experiment | Sample | Image; the overviews and dashboards are shown inside the window */
.views { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.views button.v { border-radius: 999px; padding: 5px 14px; }
.views button.v.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.views select { max-width: 240px; padding: 4px 6px; }
#viewPages { display: none; } body.pages #viewPages { display: block; } body.pages main, body.pages .setupOnly { display: none; }
body.pages header { margin-bottom: 0; }
#viewPages iframe { border: 0; width: 100%; height: calc(100vh - var(--hdr, 60px)); display: none; background: var(--bg); }
#viewPages iframe.on { display: block; }
.setupOnly { display: contents; }
.samples { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.samples-h { color: var(--muted); font-size: 11.5px; }
.srow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) auto; gap: 6px; align-items: center; }
.srow .st { font-size: 11.5px; white-space: nowrap; } .srow .st.done { color: var(--warn); }
.results .grp { color: var(--muted); margin-top: 6px; }
/*__HELP_CSS__*/
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 14px; border-radius: 8px; display: none; z-index: 10; }
</style>
</head>

<script>
"use strict";
const TOKEN = "__FH_TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function api(name, body = {}) {
  const r = await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-FH-Token": TOKEN }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
// Hover texts (title attributes) are drawn by the browser, which makes them very wide; break them into lines of
// about 60 characters when the mouse comes over them (works for titles set later too; already short lines stay).
function wrapTitle(t, n = 60) {
  return t.split("\n").map(line => {
    if (line.length <= n) return line;
    const out = []; let cur = "";
    for (const w of line.split(" ")) { if (cur && cur.length + 1 + w.length > n) { out.push(cur); cur = w; } else cur = cur ? cur + " " + w : w; }
    return out.concat(cur ? [cur] : []).join("\n");
  }).join("\n");
}
document.addEventListener("mouseover", (e) => {
  for (let el = e.target; el && el.nodeType === 1; el = el.parentNode) {
    if (el.title) { const w = wrapTitle(el.title); if (w !== el.title) el.title = w; return; }
  }
}, true);
function toast(msg, ms = 2500) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms); }

let SCHEMA, S, DEFAULTS, ADV_ALL = false, INFO = {}, CP = {}, OUT = {}, JOB = { n: 0, state: "idle", run_id: 0 };
const FIELD = {};  // key -> spec
const get = (key) => { const [s, k] = key.split("."); return S[s][k]; };
const set = (key, v) => { const [s, k] = key.split("."); S[s][k] = v; };
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const isChanged = (f) => !same(get(f.key), f.default);
function holds(key, c) {
  const v = get(key), isSet = !(v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length));
  if (Array.isArray(c)) return c.some(x => same(v, x));
  if ("set" in c) return isSet === c.set;
  if ("not" in c) return !c.not.some(x => same(v, x));
  return true;
}
function shown(cond) { return !cond || Object.entries(cond).every(([k, c]) => holds(k, c)); }
// a setting that is not used with the current settings is greyed out; returns the reason, or "" if used
function unusedReason(f) {
  if (f.unused) return f.unused;  // never used by this version
  if (!f.enable) return "";
  const failed = Object.entries(f.enable).find(([k, c]) => !holds(k, c));
  return failed ? (SCHEMA.reasons[failed[0]] || "not used with the current settings") : "";
}

// ---------------------------------------------------------------- facts from the input files
function fileFacts() {
  const files = (S.input.files || []).map(p => INFO[p]).filter(Boolean);
  const num = (k) => files.map(f => f[k]).filter(v => v != null);
  return { files, channels: Math.max(0, ...num("channels")), frames: Math.min(Infinity, ...num("frames")),
           positions: files.length > 0 && files.every(f => f.stitched || f.positions), interval: files.length > 0 && files.every(f => f.frame_interval) };
}
async function inspect(paths) {
  const todo = paths.filter(p => !(p in INFO)); if (!todo.length) return;
  try { for (const f of (await api("inspect", { paths: todo })).files) INFO[f.path] = f; } catch (e) { toast(e.message); }
  render();
}
function fileMeta(f) {
  if (!f) return "…";
  if (!f.exists) return `<span class="bad">not found</span>`;
  if (f.error) return `<span class="bad">${esc(f.error)}</span>`;
  const parts = [];
  if (f.tiles) parts.push(`${f.tiles} tiles, stitched`);
  if (f.series) parts.push(`${f.series} series`);
  if (f.width) parts.push(`${f.width}×${f.height} px`);
  if (f.frames) parts.push(`${f.frames} frames`);
  if (f.channels) parts.push(`${f.channels} ch`);
  if (f.pixel_size) parts.push(`${f.pixel_size} µm/px`);
  if (f.frame_interval) parts.push(`${(+f.frame_interval).toFixed(2)} s/frame`);
  if (f.size_mb != null) parts.push(f.size_mb >= 1000 ? `${(f.size_mb / 1000).toFixed(1)} GB` : `${f.size_mb} MB`);
  return esc(parts.join(" · ")) + (f.stitched ? ` <span class="chip ok">stitched · stage positions</span>`
    : f.positions ? ` <span class="chip ok">stage position</span>` : "");
}

// ---------------------------------------------------------------- Cellpose status
const CP_MODELS = { cyto3: "cyto3 (Cellpose 3)", nuclei: "nuclei (Cellpose 3)", cyto2_cp3: "cyto2_cp3 (Cellpose 3)", cpsam: "cpsam (Cellpose 4, Cellpose-SAM)" };
function cpVersion() { return S.segmentation.cellpose_version || (S.segmentation.cellpose_model === "cpsam" ? 4 : 3); }
function cpPython() { return S.segmentation[`cellpose${cpVersion()}_python`] || ""; }
async function checkCellpose() {
  const py = cpPython(), key = `${cpVersion()}|${py}`;
  if (CP[key]) return; CP[key] = { pending: true }; render();
  try { CP[key] = await api("cellpose", { python: py }); } catch (e) { CP[key] = { error: e.message }; }
  render();
  if (CP[key].cached) {  // shown at once from the last check; verify in the background (starting PyTorch takes seconds)
    try { CP[key] = await api("cellpose", { python: py, fresh: true }); } catch (e) { CP[key] = { error: e.message }; }
    render();
  }
}
function cpStatus() {
  if (S.segmentation.method !== "cellpose") return "";
  const v = cpVersion(), r = CP[`${v}|${cpPython()}`];
  if (!r) { setTimeout(checkCellpose); return `<span class="chip">checking Cellpose…</span>`; }
  if (r.pending) return `<span class="chip">checking Cellpose ${v}…</span>`;

// the samples (runs) in the experiment folder, and which were analyzed with other settings than this window
const EXPS = {};

  if (!(key in EXPS)) {

// ---------------------------------------------------------------- checks before running

    let problems; try { problems = (await api("check", { settings: chk })).problems; } catch (e) { problems = [e.message]; }

      + `Run analysis replaces it; ${S.input.experiment ? "Re-apply this sample" : "Re-apply screening"} redoes the screening of these images.`);
    if (imageSettingsDiffer(o)) add("warn", `The run in the output folder has other own settings for ${differingImages(o).join(", ")} `
      + "than this window: Re-apply screening uses the ones listed under Stimulation and calibration");

    if (normPath(o.run.stage_positions_file) !== normPath(S.screening.stage_positions_file) && S.screening.enabled)

  if (S.input.experiment) {

      const others = x.samples.filter(s => !samePath(S.input.experiment.replace(/[\\/]+$/, "") + "/" + s.name, S.input.output)).length;
      add("info", `The experiment folder holds ${plural(x.samples.length, "sample")}: ${x.samples.map(s => s.name + (s.label ? ` (${s.label})` : "")).join(", ")}`
        + (others < x.samples.length ? "; the sample in the window is one of them" : ""));

function readInput(el) {

  const f = FIELD[fieldEl.dataset.key];

  else if (f.kind === "boolselect") v = el.value === "true";
  else if (f.kind === "pair") {
    const a = $(el.id.replace(/_[01]$/, "_0")).value, b = $(el.id.replace(/_[01]$/, "_1")).value;
    v = a === "" && b === "" ? null : [a === "" ? null : +a, b === "" ? null : +b];
  } else if (f.kind === "intlist") v = el.value.trim() ? el.value.split(/[,\s]+/).filter(Boolean).map(Number) : null;
  else if (f.kind === "model") v = el.tagName === "SELECT" ? (el.value === "__custom" ? "" : el.value) : el.value;
  else if (f.num && f.kind === "select") v = +el.value;
  else if (el.dataset.num) v = el.value === "" ? (f.optional ? null : f.default) : (el.dataset.num === "int" ? parseInt(el.value, 10) : parseFloat(el.value));

  document.querySelectorAll("#views [data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  document.body.classList.toggle("pages", view !== "setup");
  document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
  for (const v of FRAMES) {
    const fr = $("fr-" + v); fr.classList.toggle("on", v === view);
    if (v !== view) continue;
    const url = pageURL(target) + (opts.hash || "");
    if (fr.dataset.url !== url) {  // replace(): no entries in the browser history for the frame
      if (fr.dataset.url) fr.contentWindow.location.replace(url); else fr.src = url;
      fr.dataset.url = url;
    }
  }
  $("popOut").hidden = view === "setup";
  document.title = view === "setup" ? "FAST-HIPPOS" : `${view === "image" ? VIEW.image : baseName(view === "experiment" ? S.input.experiment : S.input.output)} · FAST-HIPPOS`;
  const hash = "#" + view + (view === "image" ? "/" + encodeURIComponent(VIEW.image) : "");
  if (!opts.fromHistory && location.hash !== hash) history.pushState({ view, image: VIEW.image }, "", hash);
}
addEventListener("popstate", (e) => { const st = e.state || { view: "setup" }; show(st.view, { image: st.image, fromHistory: true }); });
addEventListener("resize", () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px"));
document.querySelectorAll("#views [data-view]").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
$("selImage").onchange = (e) => show("image", { image: e.target.value });
$("selSample").onchange = async (e) => {
  const v = e.target.value;
  if (v === "__new") { newSample(); renderNav(); return; }
  if (v && await switchSample(v) && VIEW.cur !== "setup") VIEW.want = { view: VIEW.cur === "experiment" ? "sample" : VIEW.cur };
  renderNav();
};
$("popOut").onclick = () => { const fr = $("fr-" + VIEW.cur); if (fr.dataset.url) window.open(fr.dataset.url, "_blank"); };
// load a sample of the experiment into the window (asks first when the images in the window were not analyzed yet)
async function switchSample(name) {
  const out = joinP(S.input.experiment, name);
  if (samePath(out, S.input.output)) return true;
  let o; try { o = await api("output", { path: out }); OUT[out] = o; } catch (e) { toast(e.message, 5000); return false; }
  if (!o.run) { toast(`${name} holds no analyzed sample`, 4000); return false; }
  const cur = outputState();
  if ((S.input.files || []).length && cur !== null && !(cur && cur.run)
      && !confirm(`The images of the sample in the window (${S.input.files.map(baseName).join(", ")}) are not analyzed yet.\n\n`
        + `Switch to sample ${name} anyway? Its images then replace them in the Images list.`)) return false;
  const inp = o.run.input || {};
  S.input.output = out; S.input.files = inp.files || o.run.inputs || []; S.input.series = inp.series ?? null;
  S.input.sample_label = null; S.image = structuredClone(o.run.image_settings || {});
  for (const k in ROWS) delete ROWS[k];
  if (S.input.files.length === 1) ROWS[S.input.files[0] + "|" + (S.input.series ? S.input.series[0] : "")] = { name, label: inp.sample_label || "" };
  inspect(S.input.files); render(); api("remember", { settings: S }).catch(() => {});
  toast(`Sample ${name}: its images, folder and label are now in the window (the analysis settings stay)`, 4500);
  return true;
}
// called by the pages in the frames (common/base.js) for a link to another overview or dashboard
window.FH_SHELL = {
  open(href) {
    const u = new URL(href, location.href);
    if (u.origin !== location.origin || !u.pathname.startsWith("/files/")) { window.open(u.href, "_blank"); return; }
    const path = decodeURIComponent(u.pathname.slice(7)), name = baseName(path).toLowerCase(), dir = parentPath(path);
    if (name === "dashboard.html") { goRun(parentPath(dir), { view: "image", image: baseName(dir), hash: u.hash }, u.href); return; }
    if (name === "index.html" && S.input.experiment && samePath(dir, S.input.experiment)) { show("experiment"); return; }
    if (name === "index.html") { goRun(dir, { view: "sample" }, u.href); return; }
    window.open(u.href, "_blank");
  },
};
async function goRun(run, want, href) {
  if (!samePath(run, S.input.output)) {
    if (!(S.input.experiment && samePath(parentPath(run), S.input.experiment))) { window.open(href, "_blank"); return; }
    if (!(await switchSample(baseName(run)))) return;
  }
  VIEW.want = want; renderNav();
}
// the pages follow the light / dark of the window; the help button and ? / F1 open the help of the page shown
const shellTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function syncTheme(fr) {
  try {
    const d = fr.contentDocument, w = fr.contentWindow; if (!d || !d.getElementById("theme")) return;
    const cur = d.documentElement.dataset.theme || (w.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    if (cur !== shellTheme()) d.getElementById("theme").click();
  } catch { /* not loaded */ }
}
FRAMES.forEach(v => $("fr-" + v).addEventListener("load", () => syncTheme($("fr-" + v))));
$("bTheme").addEventListener("click", () => FRAMES.forEach(v => syncTheme($("fr-" + v))));
function frameHelp() {
  try { const w = $("fr-" + VIEW.cur).contentWindow; w.FH_HELP.open(w.document.body.dataset.helpHome); return true; } catch { return false; }
}
document.addEventListener("click", (e) => {
  if (VIEW.cur !== "setup" && e.target.closest && e.target.closest("#helpBtn") && frameHelp()) { e.preventDefault(); e.stopPropagation(); }
}, true);
addEventListener("keydown", (e) => {
  if (VIEW.cur !== "setup" && (e.key === "F1" || (e.key === "?" && !e.target.closest("input, select, textarea"))) && frameHelp()) {
    e.preventDefault(); e.stopImmediatePropagation();
  }
}, true);
// One window: a page cannot bring another tab to the front, so a newer tab (a second start of FAST-HIPPOS opens one,
// already in front) takes over and this one closes itself. Browsers that refuse to close it get a note instead.
let REPLACED = false;
if ("BroadcastChannel" in window) {
  const tabs = new BroadcastChannel("fast-hippos-window");
  tabs.onmessage = (e) => {
    if (e.data !== "new" || REPLACED) return;
    REPLACED = true;
    if (rememberTimer) { clearTimeout(rememberTimer); api("remember", { settings: S }).catch(() => {}); }  // the last change
    $("stopTitle").textContent = "FAST-HIPPOS is open in another tab";
    $("stopText").textContent = "It continues there; you can close this tab.";
    $("stopped").classList.remove("busy"); $("stopped").classList.add("on");
    window.close();
  };
  tabs.postMessage("new");
}
// polls all the time: re-applies can also be started from a dashboard ('Apply to all images' / 'Apply to this image only')
async function poll() {
  if (REPLACED) return;
  poll.fails = poll.fails || 0;
  let st;
  try { st = await api("status", { since: JOB.n }); poll.fails = 0; }
  catch { if (++poll.fails >= 3) $("stopped").classList.add("on"); setTimeout(poll, 2000); return; }
  $("stopped").classList.remove("on");
  if (st.run_id !== JOB.run_id) {  // a run this page did not start
    JOB = { n: 0, state: st.state, run_id: st.run_id }; $("log").innerHTML = "";
    if (st.source === "dashboard" && st.settings) { setSettings(st.settings); toast(st.applied || "Settings applied from a dashboard", 5000); }
    setTimeout(poll, 0); return;
  }
  const changedState = st.state !== JOB.state;
  const log = $("log"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  for (const line of st.lines) {
    const cls = /ERROR|Traceback|Error:/.test(line) ? "e" : /WARNING/.test(line) ? "w" : "";
    log.insertAdjacentHTML("beforeend", `<span class="${cls}">${esc(line)}</span>\n`);
  }
  if (atEnd) log.scrollTop = log.scrollHeight;
  JOB.n = st.n; JOB.state = st.state;
  const all = log.textContent, nImg = (all.match(/INFO {4}--- /g) || []).length, total = Math.max(1, S.input.files.length);
  const label = { idle: "Ready", running: "Running…", done: "Done", failed: "Failed", stopped: "Stopped" }[st.state];
  $("state").textContent = label; $("state").className = "state " + st.state;
  const smp = [...all.matchAll(/=== Sample (\d+) of (\d+)/g)].pop();  // re-apply to all samples
  $("stateInfo").textContent = st.state !== "running" ? "" : smp ? `sample ${smp[1]} of ${smp[2]}` : `image ${Math.min(nImg, total)} of ${total}`;
  $("bar").style.width = (st.state === "done" ? 100 : st.state === "running" ? Math.min(95, (Math.max(nImg, 1) - 0.5) / total * 100) : 0) + "%";
  $("bStop").disabled = st.state !== "running";
  if (changedState) { delete OUT[S.input.output || ""]; for (const k in EXPS) delete EXPS[k]; renderChecks(); renderResults(); }  // re-check for results
  setTimeout(poll, st.state === "running" ? 700 : 2000);
}
$("results").addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { show(g.dataset.go, { image: g.dataset.image }); return; }
  const b = e.target.closest("[data-open]"); if (b) api("open", { path: b.dataset.open }).catch(err => toast(err.message));
});

// images with their own settings (Settings.image): set in an image's dashboard with 'Apply to this image only'
const OWN_LABELS = { stimulation_frame: "stimulation", calibration_frame: "calibration", baseline_only: "baseline only", no_calibration: "no calibration", sensitivity: "detection threshold",
  margin: "margin", response_window: "response window", response_window_anchor: "window anchor", response_window_margin: "window margin" };
const OWN_VALUES = { after_stimulation: "after S", before_calibration: "before C" };
function ownText(own) {
  const noCal = !!(own.events && own.events.no_calibration);
  const val = (k, v) => k === "response_window" && !(v > 0) ? "full" : v === null || v === "" ? (k === "calibration_frame" && noCal ? "none" : "automatic") : v === true ? "yes" : v === false ? "no" : OWN_VALUES[v] || v;
  return Object.values(own).flatMap(sec => Object.entries(sec).map(([k, v]) => `${OWN_LABELS[k] || k} ${val(k, v)}`)).join(", ");
}
// the own settings of single images of the run in a newly chosen output folder: taken over when this window has
// none (so that a re-apply keeps them); a warning when both have some and they differ
const sameJSON = (a, b) => JSON.stringify(a || {}) === JSON.stringify(b || {});
function differingImages(o) {  // the images whose own settings differ between the run and this window
  const a = (o.run && o.run.image_settings) || {}, b = S.image || {};
  return [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(n => JSON.stringify(a[n] || null) !== JSON.stringify(b[n] || null));
}
function imageSettingsDiffer(o) { return !!(o && o.run && !sameJSON(o.run.image_settings, S.image)); }
function adoptImageSettings(o) {
  if (o && o.run && o.run.sample_label && !S.input.sample_label && S.input.experiment) { S.input.sample_label = o.run.sample_label; render(); }
  const run = o && o.run && o.run.image_settings;
  if (run && Object.keys(run).length && !Object.keys(S.image || {}).length) {
    S.image = structuredClone(run); render();
    toast(`Own settings of single images taken over from the run in the output folder: ${Object.keys(run).join(", ")}`, 5000);
  }
}
function imageSettingsHTML() {
  const entries = Object.entries(S.image || {});
  const tip = "Images that use other stimulation settings or another response window than the settings above. Set them in the dashboard of "
    + "the image with 'Apply to this image only'; they are used by runs and re-applies until you remove them here.";
  if (!entries.length) return `<div class="imgsets muted" title="${esc(tip)}"><span>All images use these settings. To give one image its own stimulation frames or response window, use <i>Apply to this image only</i> in its dashboard.</span></div>`;
  return `<div class="imgsets" title="${esc(tip)}"><div class="imgsets-h">Own settings of single images <button class="hq" type="button" data-help-btn="guide/own-settings" title="Explain this (opens the manual)">?</button></div>` + entries.map(([name, own]) =>
    `<div class="imgset"><b>${esc(name)}</b><span class="muted">${esc(ownText(own))}</span><button class="small" data-rmimg="${esc(name)}" title="Remove the own settings of this image: it then uses the settings above (at the next run or re-apply)">✕</button></div>`).join("") + "</div>";
}
function setSettings(s) {
  S = s; S.image = S.image || {};
  for (const sec of SCHEMA.sections) for (const f of sec.fields) { const [a, k] = f.key.split("."); if (!(k in S[a])) S[a][k] = structuredClone(f.default); }
  inspect(S.input.files || []); render();
}
(async () => {
  SCHEMA = await api("schema");
  for (const sec of SCHEMA.sections) for (const f of sec.fields) FIELD[f.key] = f;
  DEFAULTS = (await api("defaults")).settings;
  const init = await api("initial");
  $("ver").textContent = "version " + SCHEMA.version;
  $("from").textContent = init.from ? "last used settings" : "default settings";
  setSettings(init.settings);
  const h = location.hash.slice(1).split("/");  // a view in the address (#sample, #image/<name>), e.g. after a reload
  history.replaceState({ view: "setup" }, "", location.pathname);
  if (FRAMES.includes(h[0])) VIEW.want = { view: h[0], image: h[1] ? decodeURIComponent(h[1]) : "" };
  const st = await api("status"); JOB = { n: 0, state: st.state, run_id: st.run_id };
  poll();
})();
</script>
