# Tests on Windows, Linux and macOS for every push. The installers are built and tried on request
# (Actions > build > Run workflow) or for a version tag (v1.2.3). A tag also attaches setup.exe to a DRAFT release, which
# is published by hand: only a published release is offered to users as an update.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: "Also build and try the installers (with Cellpose 3)"
        type: boolean
        default: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hanging test fails here instead of after six hours
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests installer
      - run: uv run pytest -q -p no:warnings

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag is the program's version
        run: |
          v=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' src/fast_hippos/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, but the program says $v"; exit 1; }

  windows-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.installers || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build setup.exe
        shell: pwsh
        run: |
          $env:UV_EXE = (Get-Command uv).Source
          ./installer/build-windows.ps1
      - name: Install silently with Cellpose 3, then check
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/build/FAST-HIPPOS-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CELLPOSE=3', "/DIR=$env:RUNNER_TEMP\fh"
          Get-Content "$env:RUNNER_TEMP\fh\install.log" -Tail 20
          if ($p.ExitCode -ne 0) { throw "setup failed" }
          & "$env:RUNNER_TEMP\fh\.venv\Scripts\python.exe" installer/check.py
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
      - name: Uninstall
        shell: pwsh
        run: |
          Start-Process -Wait "$env:RUNNER_TEMP\fh\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if (Test-Path "$env:RUNNER_TEMP\fh\.venv") { throw "the uninstaller left the program" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/build/FAST-HIPPOS-Setup-*.exe

  unix-install:
    if: github.event_name == 'workflow_dispatch' && inputs.installers || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: install.sh with Cellpose 3
        run: FAST_HIPPOS_INSTALL_DIR="$RUNNER_TEMP/fh" sh install.sh --cellpose 3
      - name: Check the installation
        run: |
          "$RUNNER_TEMP/fh/.venv/bin/python" installer/check.py
      - name: The window starts
        run: |
          HOME="$RUNNER_TEMP/home" FAST_HIPPOS_NO_BROWSER=1 "$RUNNER_TEMP/fh/.venv/bin/fast-hippos" --port 8779 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8779/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8779/ | grep -q "FAST-HIPPOS"
      - name: The menu entry or app
        run: ls ~/.local/share/applications/fast-hippos.desktop 2>/dev/null || ls -d ~/Applications/"FAST-HIPPOS.app"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows-setup, unix-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
      # The release notes are the CHANGELOG section of this version; the program shows them when it offers the update.
      - name: Release notes from the CHANGELOG
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(sys.argv[1]) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          make_latest: "true"
          body_path: notes.md
          files: FAST-HIPPOS-Setup-*.exe
